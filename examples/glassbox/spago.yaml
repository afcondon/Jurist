package:
  name: glassbox-on-julia
  description: >
    Glassbox's conformance table, generated by its unmodified core running on
    Julia, and held byte for byte to the table Node generated.
  dependencies:
    - console
    - effect
    - either
    - foldable-traversable
    - glassbox
    - prelude
workspace:
  extraPackages:
    # Pinned to a commit, from the public repo, so this example builds from a
    # fresh clone with nothing beside it. The same checkout supplies the
    # machines and the committed vectors the run is compared with.
    glassbox:
      git: https://github.com/afcondon/purescript-glassbox.git
      ref: 431dc2c013c4a4b9e751731b1e8e70b9d57bcacd
      subdir: core
  packageSet:
    registry: 80.8.0
  backend:
    cmd: "true"
