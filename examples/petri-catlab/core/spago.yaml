package:
  name: petri-core
  description: >
    The pure half of the Tier-3 Petri-net surface: the typed description
    (species, transitions with mass-action rates) and the demo models (SIR,
    SEIR), and the mass-action laws read off a net as text and as numbers. No
    foreign imports, so it compiles on every PureScript backend. The Julia
    denotation (AlgebraicPetri, in the parent workspace) solves the net and
    is checked against those laws (ADR-0007).
  dependencies:
    - prelude
    - arrays
    - foldable-traversable
    - integers
    - maybe
    - strings
    - tuples
